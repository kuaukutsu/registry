name: Docker Image CI

on:
  release:
    types: [ published ]

jobs:
  buildx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 8.1-cli
            context: ./php/8.1/cli
          - name: 8.1-fpm
            context: ./php/8.1/fpm
          - name: 8.2-cli
            context: ./php/8.2/cli
          - name: 8.2-fpm
            context: ./php/8.2/fpm
          - name: 8.3-cli
            context: ./php/8.3/cli
          - name: 8.3-fpm
            context: ./php/8.3/fpm
          - name: 8.4-cli
            context: ./php/8.4/cli
          - name: 8.4-fpm
            context: ./php/8.4/fpm
          - name: 8.5-cli
            context: ./php/8.5/cli
          - name: 8.5-fpm
            context: ./php/8.5/fpm

    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Package Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PHP ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/php:${{ matrix.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
